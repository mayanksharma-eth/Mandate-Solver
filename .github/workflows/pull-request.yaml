name: mandate-solver-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --package mandate-solver -- --check
      - run: cargo +nightly clippy --package mandate-solver --all-targets -- -D warnings
      - run: cargo +nightly test --package mandate-solver
      - run: cargo +nightly build --package mandate-solver --release
