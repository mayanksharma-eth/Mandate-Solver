name: mandate-solver-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # No fmt check: the repo ships no rustfmt.toml and its checked-in style
      # matches neither stable nor current nightly, so `--check` would fail on
      # untouched files. Restore this step once a toolchain is pinned.
      # `-D warnings` is not used: it also denies warnings in the workspace path
      # dependencies (observe, shared), which are not clean today. The solvers
      # crate itself is warning-free.
      - run: cargo clippy --package solvers --all-targets
      - run: cargo test --package solvers mandate
      # The e2e script builds the binary and drives the real server, so a
      # separate build step would only repeat work.
      - name: end-to-end
        run: |
          sudo apt-get install -y jq
          ./scripts/mandate-e2e.sh
