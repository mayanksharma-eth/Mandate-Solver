[package]
name = "mandate-solver"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Non-custodial route selection for Mandate Foundation intents"

[dependencies]
alloy-primitives = { version = "1.5", features = ["serde"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
serde_json = "1"
